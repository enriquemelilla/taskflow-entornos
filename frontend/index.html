<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <h1>TaskFlow</h1>
    <p>Gestión de categorías y tareas</p>
    <button type="button" id="logout-btn" class="secondary">Cerrar sesión</button>
  </header>

  <main>
    <section class="panel">
      <h2>Categorías</h2>

      <form id="category-form">
        <input type="hidden" id="category-id">

        <div class="form-group">
          <label for="category-name">Nombre</label>
          <input type="text" id="category-name" required>
          <div class="field-error" id="category-name-error"></div>
        </div>

        <div class="form-group">
          <label for="category-description">Descripción</label>
          <textarea id="category-description" rows="3"></textarea>
          <div class="field-error" id="category-description-error"></div>
        </div>

        <div class="button-group">
          <button type="submit">Guardar categoría</button>
          <button type="button" id="cancel-category-edit" class="secondary">Cancelar edición</button>
        </div>
      </form>

      <div id="category-message" class="message"></div>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="categories-list"></tbody>
      </table>
    </section>

    <section class="panel">
      <div class="filter-box">
        <label for="task-category-filter">Filtrar tareas por categoría</label>
        <select id="task-category-filter">
          <option value="">Todas las categorías</option>
        </select>

        <button type="button" id="clear-task-filter" class="secondary">
          Quitar filtro
        </button>
      </div>

      <h2>Tareas</h2>

      <form id="task-form">
        <input type="hidden" id="task-id">

        <div class="form-group">
          <label for="task-title">Título</label>
          <input type="text" id="task-title" required>
          <div class="field-error" id="task-title-error"></div>
        </div>

        <div class="form-group">
          <label for="task-description">Descripción</label>
          <textarea id="task-description" rows="3"></textarea>
          <div class="field-error" id="task-description-error"></div>
        </div>

        <div class="form-group">
          <label for="task-status">Estado</label>
          <select id="task-status" required>
            <option value="pendiente">Pendiente</option>
            <option value="en progreso">En progreso</option>
            <option value="completada">Completada</option>
          </select>
          <div class="field-error" id="task-status-error"></div>
        </div>

        <div class="form-group">
          <label for="task-due-date">Fecha límite</label>
          <input type="date" id="task-due-date">
          <div class="field-error" id="task-due-date-error"></div>
        </div>

        <div class="form-group">
          <label for="task-category">Categoría</label>
          <select id="task-category" required>
            <option value="">Selecciona una categoría</option>
          </select>
          <div class="field-error" id="task-category-error"></div>
        </div>

        <div class="button-group">
          <button type="submit">Guardar tarea</button>
          <button type="button" id="cancel-task-edit" class="secondary">Cancelar edición</button>
        </div>
      </form>

      <div id="task-message" class="message"></div>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Título</th>
            <th>Descripción</th>
            <th>Estado</th>
            <th>Fecha</th>
            <th>Categoría</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tasks-list"></tbody>
      </table>
    </section>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
